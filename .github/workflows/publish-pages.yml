name: 构建 staging / 生产（Gitee staging → preview，master → pages）

# 拓扑：
#   Gitee staging 内容 → preview 分支（Cloudflare Preview / staging）
#   Gitee master  内容 → pages 分支（Cloudflare 生产）
#   代码永远来自 GitHub master（engine/theme/workflows）；
#   代码可用 sync-code.yml 从 Gitee code 分支同步，内容投稿者不碰代码。
#
# 生产发布不需要 promote 命令：在 Gitee 把 staging 合并到 master，下一次构建自动更新 pages。
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gitee-update]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: master
            target: pages
            label: 生产
          - source: staging
            target: preview
            label: staging
    concurrency:
      group: publish-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 取 Gitee ${{ matrix.source }} 的内容（只覆盖 site/content）
        id: src
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          BRANCH: ${{ matrix.source }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/rustembed/site.git"
          else
            URL="https://gitee.com/rustembed/site.git"
          fi

          if ! git ls-remote --exit-code --heads "$URL" "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Gitee 分支 $BRANCH 不存在"
            exit 1
          fi

          if ! git fetch "$URL" "$BRANCH" --quiet; then
            echo "::error::Gitee $BRANCH 拉取失败"
            exit 1
          fi

          if [ "$BRANCH" = "staging" ]; then
            # staging 是预览源：原样覆盖内容，不做“谁更新”的比较
            git checkout FETCH_HEAD -- site/content
            echo "使用 Gitee staging 内容"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # master：比较「site/content 内容树」，而不是提交祖先关系
          GH_TREE=$(git rev-parse HEAD:site/content)
          GITEE_TREE=$(git rev-parse FETCH_HEAD:site/content)
          if [ "$GH_TREE" = "$GITEE_TREE" ]; then
            echo "内容树一致（$GH_TREE），无需覆盖"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          GH_TS=$(git log -1 --format=%ct HEAD -- site/content)
          GITEE_TS=$(git log -1 --format=%ct FETCH_HEAD -- site/content)
          if [ "$GITEE_TS" -ge "$GH_TS" ]; then
            git checkout FETCH_HEAD -- site/content
            echo "使用 Gitee 内容（$GITEE_TS >= $GH_TS）"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub 内容更新（$GH_TS > $GITEE_TS），保留 GitHub 内容"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 恢复字体（加密包 + FONT_PASSWORD）
        env:
          FONT_PASSWORD: ${{ secrets.FONT_PASSWORD }}
        run: |
          if [ -f site/fonts/misans-fonts.tar.gz.enc ] && [ -n "$FONT_PASSWORD" ]; then
            bash deploy/fonts-crypt.sh decrypt
          else
            echo "::warning::没有字体加密包或 FONT_PASSWORD，回退系统字体"
          fi

      - name: 缓存 AI 摘要 / 远端头像
        uses: actions/cache@v4
        with:
          path: |
            site/content/summaries
            site/meta/avatars
          key: pages-cache-${{ matrix.source }}-${{ hashFiles('site/content/posts/**', 'site/content/members/**') }}
          restore-keys: |
            pages-cache-${{ matrix.source }}-
            pages-cache-

      - name: 构建（先出骨架）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          export BUILT_AT="$(git log -1 --format=%cI)"
          python engine/build.py
          python engine/check.py

      - name: AI 摘要（只生产；可选，失败不阻断）
        if: matrix.source == 'master'
        continue-on-error: true
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python engine/tools/ai_summarize.py --write

      - name: 构建（带摘要）+ 自检
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          export BUILT_AT="$(git log -1 --format=%cI)"
          python engine/build.py
          python engine/check.py
          python engine/tests/test_structure.py

      - name: 发布到 ${{ matrix.target }} 分支（内容未变则跳过）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          cd dist
          git init -q
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "${TARGET}: $(git -C .. rev-parse --short HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"

          git fetch --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET" 2>/dev/null || true
          OLD_TREE=""
          if git rev-parse FETCH_HEAD^{tree} >/dev/null 2>&1; then
            OLD_TREE="$(git rev-parse FETCH_HEAD^{tree})"
          fi

          if [ "$NEW_TREE" = "$OLD_TREE" ]; then
            echo "内容未变（tree $NEW_TREE），跳过推送"
            exit 0
          fi

          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$TARGET"
          echo "已发布 $TARGET 分支：$NEW_TREE"

      - name: 摘要
        run: |
          echo "### ${{ matrix.label }}：${{ matrix.source }} → ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 源提交：${{ steps.src.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 产物：dist/ 已同步到 \`${{ matrix.target }}\` 分支" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.target }}" = "pages" ]; then
            echo "- 生产：https://rustembed.swebase.cn" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- staging：Cloudflare Preview 的 \`preview\` 分支 URL" >> "$GITHUB_STEP_SUMMARY"
          fi
