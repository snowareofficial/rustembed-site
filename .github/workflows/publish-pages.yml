name: 构建并放到 candidate（staging）；生产 promote 手动

# 拓扑：Gitee（内容/代码）→ 定时/手动 → 构建 + check
#       → 强推静态产物到 candidate 分支（Cloudflare Preview / staging）
#       → 人工验收后运行 promote-pages.yml，把 candidate 快进到 pages（生产）
# 不需要 CLOUDFLARE_API_TOKEN；GitHub Actions 只负责产出分支。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gitee-update]

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 代码永远来自 GitHub（engine/theme/workflows）；内容只从 Gitee 取 site/content。
      # 这样投稿者只需要往 Gitee 推内容，不必维护 GitHub master。
      - name: 取 Gitee 内容（只覆盖 site/content）
        id: src
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/rustembed/site.git"
          else
            URL="https://gitee.com/rustembed/site.git"
          fi
          if ! git fetch "$URL" master --quiet; then
            echo "::warning::Gitee 拉取失败，本次用 GitHub 里的内容"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 比较「site/content 的内容树」，而不是提交祖先关系：
          # 本地/Gitee 与 GitHub 的提交号可能因 API 提交而分叉，祖先关系会永远判错。
          GH_TREE=$(git rev-parse HEAD:site/content)
          GITEE_TREE=$(git rev-parse FETCH_HEAD:site/content)
          if [ "$GH_TREE" = "$GITEE_TREE" ]; then
            echo "内容树一致（$GH_TREE），无需覆盖"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 内容不同时按「最后一次改 site/content 的提交时间」取新的
          GH_TS=$(git log -1 --format=%ct HEAD -- site/content)
          GITEE_TS=$(git log -1 --format=%ct FETCH_HEAD -- site/content)
          if [ "$GITEE_TS" -ge "$GH_TS" ]; then
            git checkout FETCH_HEAD -- site/content
            echo "使用 Gitee 内容（$GITEE_TS >= $GH_TS）"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub 内容更新（$GH_TS > $GITEE_TS），保留 GitHub 内容"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi


      - name: 恢复字体（加密包 + FONT_PASSWORD）
        env:
          FONT_PASSWORD: ${{ secrets.FONT_PASSWORD }}
        run: |
          if [ -f site/fonts/misans-fonts.tar.gz.enc ] && [ -n "$FONT_PASSWORD" ]; then
            bash deploy/fonts-crypt.sh decrypt
          else
            echo "::warning::没有字体加密包或 FONT_PASSWORD，回退系统字体"
          fi

      # 摘要与头像都是构建期产物：缓存起来，避免每次重新调网关/下载
      - name: 缓存 AI 摘要 / 远端头像
        uses: actions/cache@v4
        with:
          path: |
            site/content/summaries
            site/meta/avatars
          key: pages-cache-${{ hashFiles('site/content/posts/**', 'site/content/members/**') }}
          restore-keys: |
            pages-cache-

      - name: 构建（先出骨架）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          export BUILT_AT="$(git log -1 --format=%cI)"
          python engine/build.py
          python engine/check.py

      - name: AI 摘要（可选，GLM 构建期；失败不阻断）
        continue-on-error: true
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python engine/ai_summarize.py --write

      - name: 构建（带摘要）+ 自检
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          export BUILT_AT="$(git log -1 --format=%cI)"
          python engine/build.py
          python engine/check.py
          python engine/test_structure.py

      - name: 发布到 candidate（staging）分支（内容未变则跳过）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "candidate: $(git -C .. rev-parse --short HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"

          git fetch --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" candidate 2>/dev/null || true
          OLD_TREE=""
          if git rev-parse FETCH_HEAD^{tree} >/dev/null 2>&1; then
            OLD_TREE="$(git rev-parse FETCH_HEAD^{tree})"
          fi

          if [ "$NEW_TREE" = "$OLD_TREE" ]; then
            echo "内容未变（tree $NEW_TREE），跳过推送"
            exit 0
          fi

          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:candidate
          echo "已发布 candidate（staging）分支：$NEW_TREE"

      - name: 摘要
        run: |
          echo "### staging / candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- 源提交：${{ steps.src.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 产物：dist/ 已同步到 \`candidate\` 分支" >> "$GITHUB_STEP_SUMMARY"
          echo "- 验收后执行：\`gh workflow run promote-pages.yml\`" >> "$GITHUB_STEP_SUMMARY"
