name: 构建与校验（发布见 publish-pages.yml）

on:
  push:
    branches: [ master, main ]
  # 投稿走 PR —— 必须在 PR 上就跑校验，否则贡献者拿不到任何反馈。
  # PR 只验证、不部署（见下方 deploy 步骤的 if）。
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 0) 字体：加密包 + secret 解密（没有密码就回退系统字体，不阻断）
      - name: 恢复字体（加密包 + FONT_PASSWORD）
        env:
          FONT_PASSWORD: ${{ secrets.FONT_PASSWORD }}
        run: |
          if [ -f site/fonts/misans-fonts.tar.gz.enc ] && [ -n "$FONT_PASSWORD" ]; then
            bash deploy/fonts-crypt.sh decrypt
          else
            echo "::warning::没有加密字体包或 FONT_PASSWORD，本次构建回退系统字体"
          fi

      # 0.5) AI 摘要缓存：只给新文章生成，已存在的默认跳过
      - name: 缓存远端头像
        uses: actions/cache@v4
        with:
          path: site/meta/avatars
          key: avatars-${{ hashFiles('site/content/members/**') }}
          restore-keys: |
            avatars-

      - name: 缓存 AI 摘要
        uses: actions/cache@v4
        with:
          path: site/content/summaries
          key: summaries-${{ hashFiles('site/content/posts/**') }}
          restore-keys: |
            summaries-

      # 1) 契约引擎自测：钉住每一类错误码的语义
      - name: 契约引擎自测
        run: python engine/test_contracts.py

      # 2) 渲染安全回归：转义、内联角色、嵌套列表
      - name: 渲染安全回归
        run: python engine/test_render_safety.py

      # 3) 构建。**不加 --warn-only**：契约与附件错误必须让流水线失败，
      #    否则「字段写错会被契约拦下」这句对投稿者的承诺在发布链路上不成立。
      - name: 构建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python engine/build.py

      # 4) 产物不变量自检
      - name: 产物自检
        run: python engine/check.py

      # 4.5) 前端结构断言（三栏/版心/零外链/摘要/导图等，纯静态，不需要浏览器）
      - name: 结构断言
        run: python engine/test_structure.py

      # 4.6) AI 摘要（可选；没有 secrets 或调用失败都不阻断）
      - name: AI 摘要（GLM，构建期）
        continue-on-error: true
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python engine/ai_summarize.py --write

      # 4.7) 摘要可能更新，重建一次让页面带上
      - name: 重建（带摘要）
        continue-on-error: true
        run: |
          python engine/build.py
          python engine/check.py
          python engine/test_structure.py

      # 5) 发布不在本文件：publish-pages.yml 会把 dist 推到 `pages` 分支，
      #    Cloudflare Pages 的 Git 集成直接取那个分支（不需要 CF token）。

# 说明
# 1. Cloudflare Pages 项目名 rustembed（https://rustembed.pages.dev），首次部署会自动创建；自定义域名在 CF 面板绑定：
#    rustembed.swebase.cn（主）与 rustembed.swebase.cn（别名），二者都指向同一项目。
# 2. 若绑定不了（DNS 不在 CF 托管），改用 CNAME 到 <project>.pages.dev。
# 3. 元数据抓取失败不会中断构建；缓存文件 meta/repos.json 会随提交更新。
# 4. Gitee 是权威源与 PR 落地点，但它上面没有工作流配置，所以本文件的门禁
#    只在 GitHub 镜像侧生效。要在 Gitee 侧也拦住，需要另配 Gitee Go。
