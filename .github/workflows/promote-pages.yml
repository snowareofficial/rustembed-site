name: 提升 candidate 到 pages（生产）

# 手动触发：把已经构建好的 candidate（staging）快进到 pages（生产）。
# 不做构建、不取 Gitee；只移动产物分支，保证“验收的是哪份，生产就是哪份”。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: candidate 分支或提交（默认 candidate）
        required: false
        default: candidate
        type: string

permissions:
  contents: write

concurrency:
  group: promote-pages
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 candidate 并快进到 pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --quiet "$REMOTE" "${REF}:refs/remotes/origin/candidate"
          git fetch --quiet "$REMOTE" pages:refs/remotes/origin/pages 2>/dev/null || true

          CAND="$(git rev-parse origin/candidate)"
          OLD="$(git rev-parse origin/pages 2>/dev/null || true)"
          echo "candidate=$CAND"
          echo "pages=$OLD"

          if ! git cat-file -e "${CAND}:index.html" 2>/dev/null; then
            echo "::error::candidate $CAND 不像构建产物（缺 index.html），拒绝 promote"
            exit 1
          fi

          if [ -n "$OLD" ] && [ "$CAND" = "$OLD" ]; then
            echo "candidate 与 pages 相同，无需 promote"
            exit 0
          fi

          if [ -n "$OLD" ]; then
            git push --force-with-lease="refs/heads/pages:${OLD}" "$REMOTE" "${CAND}:refs/heads/pages"
          else
            git push "$REMOTE" "${CAND}:refs/heads/pages"
          fi
          echo "已 promote：$CAND"
          echo "### promote 完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate: \`$CAND\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pages 原值: \`$OLD\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 生产：https://rustembed.swebase.cn" >> "$GITHUB_STEP_SUMMARY"
