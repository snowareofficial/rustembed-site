name: 从 Gitee 同步 engine/theme

# 目的：GitHub 不一定连得上时，仍可只推 Gitee 更新站点代码。
# 代码放 Gitee 的 `code` 分支（受保护），内容放 `master`；本工作流只取 code 分支的
# engine/ 与 site/theme/，不同步 .github/、docs/、site/content（内容由发布工作流单独取）。
#
# 安全边界（重要）：
#   `code` 分支应只允许维护者推送；内容投稿者只有 master 的 PR 权限，
#   因此不能通过改 engine/theme 在 CI 里执行代码。启用前请给 code 分支开保护。
#
# 分支名可改：同步脚本读 GITEE_CODE_BRANCH，默认 code。
env:
  GITEE_CODE_BRANCH: code
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-code
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取 Gitee 的 engine 与 site/theme
        id: gitee
        run: |
          set -euo pipefail
          git remote add gitee https://gitee.com/rustembed/site.git || true
          if ! git ls-remote --exit-code --heads gitee "$GITEE_CODE_BRANCH" >/dev/null 2>&1; then
            echo "::error::Gitee 分支 $GITEE_CODE_BRANCH 不存在；请先从 master 建 code 分支并推送"
            exit 1
          fi
          git fetch --depth=1 gitee "$GITEE_CODE_BRANCH"
          SHA="$(git rev-parse FETCH_HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/gitee-src
          mkdir -p /tmp/gitee-src
          git archive "$SHA" engine site/theme | tar -x -C /tmp/gitee-src
          rsync -a --delete /tmp/gitee-src/engine/ engine/
          rsync -a --delete /tmp/gitee-src/site/theme/ site/theme/
          echo "Gitee code: $SHA"

      - name: 有变化则提交并触发发布
        id: commit
        env:
          GITEE_SHA: ${{ steps.gitee.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain engine site/theme)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "engine/theme 无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A engine site/theme
          git commit -m "chore(sync): Gitee engine/theme @ ${GITEE_SHA:0:7}"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发发布工作流
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-pages.yml --ref master
