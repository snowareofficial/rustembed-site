name: 从 Gitee 同步镜像
# Gitee 是唯一权威源；GitHub 只做单向被动镜像，供 Actions 构建并发布到 Cloudflare Pages。
# 防误覆盖：检测到 GitHub 上有 Gitee 没有的提交时默认中止；只有手动触发且勾选 force 才丢弃。

# GitHub 不再接受日常直接 push：内容/代码先到 Gitee，再由本工作流定时拉取。
# 注意：同步是整树镜像；Gitee master 必须包含要发布的代码与内容。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 丢弃 GitHub 上 Gitee 没有的提交（危险，仅镜像修复时用）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-from-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: 配置 git 与 Gitee 远端
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config user.name "gitee-mirror"
          git config user.email "gitee-mirror@users.noreply.github.com"
          if [ -n "$GITEE_TOKEN" ]; then
            URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/rustembed/site.git"
          else
            URL="https://gitee.com/rustembed/site.git"
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "$URL"

      - name: 拉取 Gitee
        run: git fetch gitee master:refs/remotes/gitee/master --tags --force

      - name: 防误覆盖检查
        run: |
          ahead=$(git log --oneline HEAD --not refs/remotes/gitee/master | wc -l)
          if [ "$ahead" -gt 0 ]; then
            echo "GitHub 上有 $ahead 个 Gitee 没有的提交："
            git log --oneline HEAD --not refs/remotes/gitee/master | head -20
            if [ "${{ inputs.force }}" != "true" ]; then
              echo "::error::镜像将覆盖这些提交，已中止。确认要丢弃请手动触发并勾选 force。"
              exit 1
            fi
            echo "::warning::force=true，这些提交将被丢弃。"
          fi

      - name: 同步到 GitHub
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::缺少 SYNC_TOKEN；需要 Contents + Workflows 读写权限"
            exit 1
          fi
          git remote set-url origin \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B master refs/remotes/gitee/master
          git push origin master --force
          git push origin --tags --force
          echo "已同步：$(git rev-parse --short HEAD)"

      - name: 同步到第二个源（可选）
        env:
          TOKEN: ${{ secrets.SNOWARE_GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "未配置 SNOWARE_GITEE_TOKEN，跳过第二个源（snoware/sml-sitegen）"
            exit 0
          fi
          git push "https://${GITEE_USER}:${TOKEN}@gitee.com/snoware/sml-sitegen.git" master --force \
            || echo "::warning::第二个源推送失败（不影响主流程）"
