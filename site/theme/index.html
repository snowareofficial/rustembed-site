<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!--BUILD:HEAD-->
<title>Rust嵌入式探讨</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/prism/prism.css">
<link rel="alternate" type="application/rss+xml" title="RSS" href="feed.xml">
</head>
<body data-page="home" data-form="reading">

<header class="topbar">
  <a class="brand" href="#/home"><img id="brand-avatar" alt="" width="22" height="22"><span id="brand-title">Rust嵌入式探讨</span></a>
  <span class="topbar-spacer"></span>

  <!-- 桌面端：收起/展开左侧本文目录 -->
  <button class="panel-btn" id="toc-toggle" type="button" aria-label="收起目录" aria-pressed="false" title="收起/展开目录">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </svg>
  </button>

  <!-- 站点导航：在搜索左边，方形外框 + 指南针图标；<details> 收起为按钮 -->
  <details class="nav-drawer" id="nav-drawer">
    <summary class="nav-summary" aria-label="站点导航" title="站点导航">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M15.6 8.4l-2.3 5-5 2.3 2.3-5z" fill="currentColor"/>
      </svg>
    </summary>
    <nav class="site-nav" id="site-nav" aria-label="站点导航">
<!--BUILD:NAV-->
    </nav>
  </details>

  <form class="search-form" id="search-form" role="search">
    <input id="q" class="search-input" type="search" placeholder="搜索文章 / 项目 / 成员（回车）" aria-label="搜索站内内容" autocomplete="off">
    <button class="search-btn" type="submit" aria-label="搜索" title="搜索">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.6 15.6L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </form>
</header>

<div class="layout">

  <!-- 左栏：只有本文导航（本文目录 + 章节结构），不出现任何站点级入口 -->
  <aside class="col-left" id="col-left" aria-label="本文导航">
    <div class="col-left-inner">
      <p class="col-title">本文目录</p>
      <nav class="toc" id="toc-nav" aria-label="本文目录"></nav>
      <p class="col-sub"><button class="map-link" id="map-link" type="button">章节结构与导图 →</button></p>
    </div>
  </aside>

  <!-- 主栏：内容，max-width 由 --measure 控制（默认 38rem） -->
  <main class="col-main" id="main">
    <details class="mobile-toc" id="mobile-toc">
      <summary>本页目录</summary>
      <nav class="toc" id="toc-nav-m" aria-label="本页目录"></nav>
    </details>
    <div id="view">
<!--BUILD:FIRST-->
    </div>
  </main>

</div>

<footer class="footer" id="footer"></footer>

<!-- 章节结构 / 导图：内联弹层，不跳页 -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <b id="modal-title">章节结构</b>
      <button class="modal-close" type="button" data-close="1" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- 设置面板入口：右侧边缘细长三角形（首页隐藏，首页用扳手）。
     面板本体是静态节点，由 app.js 在启动时接线；不引外部图标库，内联 SVG。 -->
<button class="settings-fab" id="settings-fab" type="button"
        aria-label="打开设置" aria-expanded="false" aria-controls="settings-panel" title="设置">
  <svg viewBox="0 0 8 22" aria-hidden="true"><path d="M0.5 1 L7.5 11 L0.5 21 Z"/></svg>
</button>

<aside class="settings-panel" id="settings-panel" role="dialog" aria-label="阅读与站点设置" hidden>
  <div class="sp-head">
    <b>设置</b>
  </div>
  <div class="sp-tabs" role="tablist" aria-label="设置分类">
    <button class="sp-tab" id="settings-tab-reading" type="button" role="tab"
            aria-selected="true" aria-controls="settings-pane-reading">阅读</button>
    <button class="sp-tab" id="settings-tab-site" type="button" role="tab"
            aria-selected="false" aria-controls="settings-pane-site">站点</button>
  </div>

  <div class="sp-pane" id="settings-pane-reading" role="tabpanel" aria-labelledby="settings-tab-reading">
    <div class="sp-row">
      <label class="sp-label" for="settings-size">正文字号</label>
      <span class="sp-val" id="settings-size-val">100%</span>
    </div>
    <input class="sp-range" id="settings-size" type="range" min="90" max="120" step="5" value="100"
           aria-label="正文字号，90% 到 120%">
    <p class="sp-hint">只作用于正文；代码块字号固定，不随正文变化。</p>
    <div class="sp-row">
      <label class="sp-label" for="settings-line">行间距</label>
      <span class="sp-val" id="settings-line-val">1.8</span>
    </div>
    <input class="sp-range" id="settings-line" type="range" min="1.5" max="2.1" step="0.1" value="1.8"
           aria-label="正文行间距，1.5 到 2.1">
    <div class="sp-row">
      <span class="sp-label">恢复默认字号</span>
      <button class="sp-btn" id="settings-size-reset" type="button">重置</button>
    </div>
    <div class="sp-row">
      <label class="sp-label" for="settings-summary">折叠文章摘要</label>
      <input class="sp-switch" id="settings-summary" type="checkbox" aria-label="折叠文章摘要">
    </div>
    <div class="sp-row">
      <label class="sp-label" for="settings-toc">收起本文目录</label>
      <input class="sp-switch" id="settings-toc" type="checkbox" aria-label="收起本文目录">
    </div>
    <div class="sp-row">
      <span class="sp-label">阅读项全部恢复默认</span>
      <button class="sp-btn" id="settings-reset-all" type="button">恢复默认</button>
    </div>
  </div>

  <div class="sp-pane" id="settings-pane-site" role="tabpanel" aria-labelledby="settings-tab-site" hidden>
    <div class="sp-row">
      <label class="sp-label" for="settings-theme">主题</label>
      <select class="sp-select" id="settings-theme" aria-label="主题：跟随系统、浅色或深色">
        <option value="">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </div>
    <p class="sp-hint">默认跟随系统明暗；手动选择后只记在本机浏览器。</p>
    <div class="sp-row">
      <label class="sp-label" for="settings-recent">最近更新条数</label>
      <span class="sp-val" id="settings-recent-val">3</span>
    </div>
    <input class="sp-range" id="settings-recent" type="range" min="1" max="15" step="1" value="3"
           aria-label="最近更新显示条数，1 到 15">
    <p class="sp-hint">与首页「调整条数」面板共用同一设置。</p>
    <div class="sp-links" id="settings-links"></div>
  </div>
</aside>

<!-- 语法高亮：本地 vendor（MIT），不引 CDN。manual=true 是关键 —— 不设它 core 会在
     DOMContentLoaded 自己扫一遍全页；本站要等每次路由渲染完由 app.js 主动高亮。 -->
<script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
<script src="vendor/prism/prism.js"></script>
<script src="app.js"></script>
</body>
</html>
