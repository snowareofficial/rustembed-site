<h2 id="怎么加入">怎么加入</h2>
<p>加 QQ 群即可参与共建：写文章、做项目、整理资源，任选一种。</p>
<ul>
<li>会写：投稿技术文章（PR 或交给群管理代投）</li>
<li>会做：把你的项目挂上项目墙</li>
<li>会整理：往资源库里加书、教程、工具链</li>
</ul>
<h2 id="合作与内推">合作与内推</h2>
<p>群里会不定期放出实习、项目合作与内推信息。有需要的在群里直接说，或让群管理代发。</p>
<aside class="admonition note"><p>本站不收集任何个人隐私信息；公开在成员页上的联系方式均为本人自愿提供。</p>
</aside>
<h2 id="本站由">本站由</h2>
<p>站点内容用 <em>SML</em>（或 Markdown）书写，构建期预渲染为静态页面；契约校验、导图目录、AI 可读索引都由同一条流水线产出。</p>
